services:
  - type: web
    name: risk-premia-api
    runtime: python
    plan: free
    buildCommand: pip install -r webapp/backend/requirements.txt
    startCommand: uvicorn main:app --app-dir webapp/backend --host 0.0.0.0 --port $PORT
    envVars:
      - key: FRONTEND_ORIGINS
        value: ""
      - key: PYTHON_VERSION
        value: 3.13.0
